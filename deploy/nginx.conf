# Config do nginx DENTRO do container (serve os estáticos do site).
# O nginx do HOST termina o TLS e faz proxy reverso para cá.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nunca servir dotfiles/arquivos de deploy
    location ~ /\.(?!well-known) { deny all; }
    location = /docker-compose.yml { deny all; }
    location = /Dockerfile { deny all; }

    # Cache de assets estáticos
    location ~* \.(?:css|js|jpe?g|png|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
